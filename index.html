<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mentoria Blindagem Emocional | Cláudia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="intro-screen" id="introScreen">

        <!-- CENÁRIO RESPONSIVO -->
        <div class="scene-art">


          <picture class="scene-picture">

            <!-- IMAGEM VERTICAL PARA CELULAR -->
            <source
                media="(max-width: 600px)"
                srcset="img/fundocelular.jpg"
            >

            <!-- IMAGEM HORIZONTAL PARA DESKTOP E TABLET -->
            <img
                src="img/fundonote.jpg"
                alt="Notebook sobre pufe verde"
                class="scene-image"
            >

        </picture>

            <!-- ÁREA DA TELA DO NOTEBOOK -->
            <div class="laptop-screen" id="laptopScreen">

                <!-- PRÉVIA DO VÍDEO -->
                <video
                    class="video-preview"
                    id="videoPreview"
                    autoplay
                    muted
                    loop
                    playsinline
                    preload="auto"
                >
                    <source src="video/vsl-demo1.mp4" type="video/mp4">
                </video>

                <!-- AVISO DE ÁUDIO -->
                <div class="sound-notice" id="soundNotice">

                    <button
                        type="button"
                        class="close-notice"
                        id="closeNotice"
                        aria-label="Fechar aviso"
                    >
                        ×
                    </button>

                    <h1>
                        Seu vídeo está sendo reproduzido.
                    </h1>

                    <div class="sound-icon">

                        <svg viewBox="0 0 120 120" aria-hidden="true">

                            <path
                                d="M15 43 H38 L70 20 V100 L38 77 H15 Z"
                                fill="white"
                            />

                            <path
                                d="M80 38 Q101 60 80 82"
                                fill="none"
                                stroke="white"
                                stroke-width="9"
                                stroke-linecap="round"
                            />

                            <path
                                d="M92 23 Q122 60 92 97"
                                fill="none"
                                stroke="white"
                                stroke-width="9"
                                stroke-linecap="round"
                            />

                            <path
                                d="M13 13 L108 108"
                                stroke="white"
                                stroke-width="9"
                                stroke-linecap="round"
                            />

                        </svg>

                    </div>

                    <p>Clique para ouvir</p>

                </div>

            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
